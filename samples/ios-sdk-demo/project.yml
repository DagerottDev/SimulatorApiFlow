name: SimulatorApiFlowSample
options:
  bundleIdPrefix: dev.simulatorapiflow
packages:
  SimulatorApiFlow:
    path: ../../sdks/ios/SimulatorApiFlow
targets:
  SimulatorApiFlowSample:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    dependencies:
      - package: SimulatorApiFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simulatorapiflow.sample.ios
        PRODUCT_NAME: SimulatorApiFlow Sample
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
